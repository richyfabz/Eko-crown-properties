<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7f1d1d" />
    <meta
      name="description"
      content="Premium Nigerian real estate listings, trusted agents, property search, inspections, and seller support."
    />
    <title>Nigerian Premium Real Estate</title>
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
        } catch (error) {
          void error;
        }

        function resetScroll() {
          try {
            window.scrollTo(0, 0);
          } catch (error) {
            void error;
          }
        }

        window.addEventListener('DOMContentLoaded', resetScroll, { once: true });
        window.addEventListener('pageshow', resetScroll);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
